function reducer(state, action) {
  switch (action.type) {
    case 'NAV_PUSH':
      return {
        ...state,
        stack: [...state.stack, action.entry]
      };
    case 'NAV_BACK':
      return state.stack.length > 1 ? {
        ...state,
        stack: state.stack.slice(0, -1)
      } : state;
    case 'TAB':
      {
        const tabRoute = {
          '홈': 'home',
          '포인트': 'scholarship',
          '카드': 'spending'
        }[action.tab];
        const entry = {
          route: tabRoute || 'home'
        };
        if (action.subTab) entry.subTab = action.subTab;
        return {
          ...state,
          tab: action.tab,
          stack: [entry]
        };
      }
    case 'RESET':
      return initialState;
    case 'NOOP':
      return state;
    case 'MARK_NOTIFICATIONS_READ':
      {
        const notifications = (state.notifications || []).map(n => ({
          ...n,
          unread: false
        }));
        return {
          ...state,
          notifications
        };
      }
    case 'SUBMIT_MISSION':
      {
        const {
          missionId,
          text,
          photo
        } = action;
        const newSub = {
          id: 'sub-' + nowTs(),
          date: TODAY,
          postedAt: nowTs(),
          text,
          photo: photo || null,
          status: 'pending'
        };
        const mData = (state.missions || {})[missionId] || {
          submissions: [],
          reminderOn: false
        };
        return {
          ...state,
          missions: {
            ...state.missions,
            [missionId]: {
              ...mData,
              submissions: [...mData.submissions, newSub]
            }
          }
        };
      }
    case 'TOGGLE_MISSION_REMINDER':
      {
        const {
          missionId
        } = action;
        const mData = (state.missions || {})[missionId] || {
          submissions: [],
          reminderOn: false
        };
        return {
          ...state,
          missions: {
            ...state.missions,
            [missionId]: {
              ...mData,
              reminderOn: !mData.reminderOn
            }
          }
        };
      }
    case 'AUTO_APPROVE_LATEST':
      {
        const mData = (state.missions || {})[action.missionId] || {
          submissions: []
        };
        const pending = [...(mData.submissions || [])].reverse().find(s => s.status === 'pending');
        if (!pending) return state;
        return reducer(state, {
          type: 'APPROVE_MISSION_SUB',
          missionId: action.missionId,
          subId: pending.id,
          points: action.points,
          missionTitle: action.missionTitle
        });
      }
    case 'APPROVE_MISSION_SUB':
      {
        const {
          missionId,
          subId,
          points,
          missionTitle
        } = action;
        const mData = (state.missions || {})[missionId] || {
          submissions: []
        };
        const entryId = 'sl-' + nowTs();
        const newEntry = {
          id: entryId,
          date: TODAY,
          amount: points,
          type: '미션 인증',
          icon: '✅',
          teacherComment: `${missionTitle} 인증이 승인됐어요!`,
          confirmed: true,
          read: false
        };
        const newNotif1 = {
          id: 'notif-' + nowTs(),
          type: 'missionApproved',
          icon: 'CheckCircle',
          text: `${missionTitle} 인증이 승인됐어요!`,
          subText: `${points.toLocaleString()}P 적립됐어요.`,
          sentAt: nowTs(),
          unread: true
        };
        return {
          ...state,
          accumulatedBalance: state.accumulatedBalance + points,
          scholarshipLog: [newEntry, ...state.scholarshipLog],
          missions: {
            ...state.missions,
            [missionId]: {
              ...mData,
              submissions: mData.submissions.map(s => s.id === subId ? {
                ...s,
                status: 'approved',
                entryId
              } : s)
            }
          },
          notifications: [newNotif1, ...(state.notifications || [])]
        };
      }
    case 'REJECT_MISSION_SUB':
      {
        const {
          missionId,
          subId,
          missionTitle
        } = action;
        const mData = (state.missions || {})[missionId] || {
          submissions: []
        };
        const newNotif2 = {
          id: 'notif-' + nowTs(),
          type: 'missionRejected',
          icon: 'XCircle',
          text: `${missionTitle} 인증이 반려됐어요.`,
          subText: '아직 미션 기간이 남았어요. 다시 인증해보세요!',
          sentAt: nowTs(),
          unread: true
        };
        return {
          ...state,
          missions: {
            ...state.missions,
            [missionId]: {
              ...mData,
              submissions: mData.submissions.map(s => s.id === subId ? {
                ...s,
                status: 'rejected'
              } : s)
            }
          },
          notifications: [newNotif2, ...(state.notifications || [])]
        };
      }
    case 'GRANT_STAMP':
      {
        const board = state.stampBoard;
        const newCount = board.currentCount + 1;
        const curRound = Math.max(...(board.log || []).map(l => l.round || 0), 1);
        const reasons = ['정시 출석', '숙제 완료 제출', '단어 시험 통과', '오답 노트 제출', '수업 태도 우수'];
        const newStampEntry = {
          id: 'st-' + nowTs(),
          type: 'stamp',
          round: curRound,
          date: TODAY,
          count: 1,
          reason: action.reason || reasons[newCount % reasons.length]
        };
        const newStampLog = [newStampEntry, ...(board.log || [])];
        if (newCount >= STAMP_BOARD_CONFIG.goalCount) {
          const rp = STAMP_BOARD_CONFIG.rewardPoints;
          const newLog = {
            id: 'sl-stamp-' + nowTs(),
            date: TODAY,
            amount: rp,
            type: '스탬프 완성',
            icon: '🎉',
            teacherComment: '스탬프판을 가득 채웠어요!',
            confirmed: true,
            read: false
          };
          const newNotif = {
            id: 'notif-stamp-' + nowTs(),
            type: 'scholarship',
            icon: 'Stamp',
            text: `스탬프판 완성! +${rp.toLocaleString()}P 적립`,
            subText: '스탬프를 모두 모았어요!',
            sentAt: nowTs(),
            unread: true
          };
          const doneEntry = {
            id: 'round-' + curRound + '-complete-' + nowTs(),
            type: 'completed',
            round: curRound,
            date: TODAY,
            rewardPoints: rp,
            goalCount: STAMP_BOARD_CONFIG.goalCount
          };
          return {
            ...state,
            stampBoard: {
              ...board,
              currentCount: 0,
              log: [doneEntry, ...newStampLog]
            },
            accumulatedBalance: state.accumulatedBalance + rp,
            scholarshipLog: [newLog, ...state.scholarshipLog],
            notifications: [newNotif, ...(state.notifications || [])]
          };
        }
        return {
          ...state,
          stampBoard: {
            ...board,
            currentCount: newCount,
            log: newStampLog
          }
        };
      }
    case 'GRANT_SCHOLARSHIP':
      {
        const {
          amount,
          scholarType,
          icon,
          teacherComment,
          entryId
        } = action;
        const newEntry = {
          id: entryId || 'sl-' + nowTs(),
          date: TODAY,
          amount,
          type: scholarType,
          icon: icon || '🏆',
          teacherComment: teacherComment || '',
          confirmed: true,
          read: false
        };
        const pendingEvent = {
          type: 'scholarship',
          amount,
          scholarType,
          icon: icon || '🏆',
          teacherComment: teacherComment || '',
          newBalance: state.accumulatedBalance + amount,
          entryId: newEntry.id
        };
        const newNotif3 = {
          id: 'notif-' + nowTs(),
          type: 'scholarship',
          icon: 'Trophy',
          text: `${scholarType} 포인트 ${amount.toLocaleString()}P 적립`,
          subText: teacherComment || '',
          sentAt: nowTs(),
          unread: true
        };
        return {
          ...state,
          accumulatedBalance: state.accumulatedBalance + amount,
          scholarshipLog: [newEntry, ...state.scholarshipLog],
          notifications: [newNotif3, ...(state.notifications || [])]
        };
      }
    case 'DEDUCT_SCHOLARSHIP':
      {
        const {
          amount,
          reason,
          teacherComment
        } = action;
        const newEntry = {
          id: 'dd-' + nowTs(),
          date: TODAY,
          amount,
          reason: reason || '차감',
          teacherComment: teacherComment || '',
          read: false
        };
        const newBalance = state.accumulatedBalance - amount;
        const pendingEvent = {
          type: 'deduction',
          amount,
          reason: reason || '차감',
          teacherComment: teacherComment || '',
          newBalance,
          entryId: newEntry.id
        };
        const newNotif4 = {
          id: 'notif-' + nowTs(),
          type: 'deduction',
          icon: 'AlertTriangle',
          text: `${reason}으로 포인트 ${amount.toLocaleString()}P 차감`,

          sentAt: nowTs(),
          unread: true
        };
        return {
          ...state,
          accumulatedBalance: newBalance,
          deductionLog: [newEntry, ...(state.deductionLog || [])],
          notifications: [newNotif4, ...(state.notifications || [])]
        };
      }
    case 'CHARGE_CARD':
      {
        const {
          amount
        } = action;
        const newEntry = {
          id: 'ch-' + nowTs(),
          date: TODAY,
          amount
        };

          type: 'charge',
          amount
        };
        const newNotif5 = {
          id: 'notif-' + nowTs(),

          storyLog: [newStory, ...(state.storyLog || [])]
        };
      }
    default:
      return state;
  }
