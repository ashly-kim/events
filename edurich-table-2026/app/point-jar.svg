<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" width="280" height="260">
  <defs>
    <filter id="hand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <g id="coin">
      <circle r="11" fill="#FFD45C" stroke="#E0A21F" stroke-width="2.2"/>
      <circle r="7.2" fill="none" stroke="#F0B934" stroke-width="1.4"/>
      <path d="M-2.6 4.6 V-4.6 H1.2 C4.4 -4.6 4.4 0.4 1.2 0.4 H-2.6" fill="none" stroke="#C98A0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <g filter="url(#hand)">
    <!-- 바닥 그림자 -->
    <ellipse cx="66" cy="121" rx="38" ry="5" fill="#FB75BB" opacity="0.16"/>
    <!-- 저금통 몸통 -->
    <path d="M36 50 C30 58 28 72 28 86 C28 106 40 117 66 117 C92 117 104 106 104 86 C104 72 102 58 96 50 Z"
          fill="#FFF3F9" stroke="#E2559D" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- 안에 쌓인 동전 -->
    <g transform="translate(48 103) rotate(-8)"><use href="#coin"/></g>
    <g transform="translate(70 106) rotate(6)"><use href="#coin"/></g>
    <g transform="translate(88 101) rotate(-4)"><use href="#coin"/></g>
    <g transform="translate(59 91) rotate(10)"><use href="#coin"/></g>
    <g transform="translate(80 89) rotate(-12)"><use href="#coin"/></g>
    <!-- 뚜껑 -->
    <rect x="32" y="40" width="68" height="13" rx="5" fill="#FB75BB" stroke="#E2559D" stroke-width="2.4"/>
    <rect x="56" y="43" width="20" height="4" rx="2" fill="#C93F87"/>
    <!-- 유리 반짝임 -->
    <path d="M38 62 C35 70 35 78 36 84" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <!-- 얼굴 -->
    <ellipse cx="51" cy="74" rx="4.2" ry="2.6" fill="#FB75BB" opacity="0.5"/>
    <ellipse cx="81" cy="74" rx="4.2" ry="2.6" fill="#FB75BB" opacity="0.5"/>
    <circle cx="57" cy="69" r="2.6" fill="#16192A"/>
    <circle cx="75" cy="69" r="2.6" fill="#16192A"/>
    <circle cx="57.9" cy="68.1" r="0.8" fill="#fff"/>
    <circle cx="75.9" cy="68.1" r="0.8" fill="#fff"/>
    <path d="M62.5 74.5 Q66 78.5 69.5 74.5" fill="none" stroke="#16192A" stroke-width="2" stroke-linecap="round"/>
    <!-- 떨어지는 동전 -->
    <g transform="translate(66 22) rotate(-14)"><use href="#coin"/></g>
    <path d="M52 8 L54 14 M80 6 L78 13 M66 2 L66 7" stroke="#FB75BB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- 반짝 -->
    <path d="M114 34 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#FB75BB"/>
    <path d="M18 44 l1.4 3.4 3.4 1.4 -3.4 1.4 -1.4 3.4 -1.4 -3.4 -3.4 -1.4 3.4 -1.4 z" fill="#FFD45C"/>
    <circle cx="120" cy="62" r="2.4" fill="#FFD45C"/>
  </g>
</svg>
