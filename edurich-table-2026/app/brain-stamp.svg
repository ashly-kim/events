    <path d="M56.5 67.5 Q60 71.5 63.5 67.5" fill="none" stroke="#16192A" stroke-width="2" stroke-linecap="round"/>
    <!-- 반짝 -->
    <path d="M92 30 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 z" fill="#3B82F6"/>
