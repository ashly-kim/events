<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에듀리치테이블 교안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#EEF0F3;--ink:#16192A;--sub:#5B6270;--line:#DDE2E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:16px;font-weight:700}
.ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:6px}
.zoom button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:8px;width:32px;height:32px;background:#F0F2F5;color:var(--ink);cursor:pointer}
.zoom button:hover{background:#E4E7EC}
.zoom .zv{width:auto;padding:0 10px;font-size:12.5px;min-width:56px}
.zoom input{width:140px;accent-color:#16192A}
.dl{font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;background:#F0F2F5;padding:8px 12px;border-radius:8px}
.dl:hover{background:#E4E7EC}
main{flex:1;display:flex;justify-content:center;padding:12px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;width:100%;max-width:960px;background:#fff;border-radius:12px;overflow:hidden}
.frame{flex:1;position:relative;overflow:hidden;background:#C9CFD8}
.frame iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#C9CFD8}
@media (max-width:760px){main{padding:8px}.zoom input{width:90px}}
</style>
</head>
<body>
<header>
  <h1>에듀리치테이블 교안</h1>
  <div class="ctrl">
    <div class="zoom"><button type="button" id="zout" aria-label="작게">−</button><input type="range" id="z" min="50" max="200" step="10" value="100" aria-label="보기 크기"><button type="button" id="zin" aria-label="크게">+</button><button type="button" id="zv" class="zv" aria-label="크기 초기화">100%</button></div>
    <a class="dl" href="edurich-table-v1.pdf" download>PDF 받기</a>
  </div>
</header>
<main>
  <section class="col"><div class="frame"><iframe src="v1.html" title="에듀리치테이블 교안"></iframe></div></section>
</main>
<script>
const W=880;
const frame=document.querySelector('.frame'),el=frame.querySelector('iframe');
function fit(){const k=frame.clientWidth/W;el.style.width=W+'px';el.style.height=(frame.clientHeight/k)+'px';el.style.transform='scale('+k+')';}
window.addEventListener('resize',fit);fit();
const zr=document.getElementById('z'),zv=document.getElementById('zv');
function setZ(v){v=Math.max(50,Math.min(200,v));zr.value=v;zv.textContent=v+'%';try{const d=el.contentDocument;if(d&&d.body){const w=el.contentWindow;const r=w.scrollY/Math.max(1,d.documentElement.scrollHeight);d.body.style.zoom=v/100;w.scrollTo(w.scrollX,r*d.documentElement.scrollHeight);}}catch(e){}try{localStorage.setItem('edz',v)}catch(e){}}
zr.oninput=()=>setZ(+zr.value);
document.getElementById('zin').onclick=()=>setZ(+zr.value+10);
document.getElementById('zout').onclick=()=>setZ(+zr.value-10);
zv.onclick=()=>setZ(100);
let z0=100;try{z0=+(localStorage.getItem('edz')||100)}catch(e){}
el.addEventListener('load',()=>setZ(+zr.value));
setZ(z0);
</script>
</body>
</html>
