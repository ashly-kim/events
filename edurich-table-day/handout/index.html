<title>에듀리치테이블 교안 | 에듀리치 테이블 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" crossorigin="anonymous">
<style>
:root{--bg:#050A16;--blue:#3B82F6;--blue-l:#93C5FD;--txt:#E8EEF8;--sub:#9DB0CC;--card2:rgba(255,255,255,.085);--sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
.bar{position:sticky;top:0;z-index:10;background:rgba(5,10,22,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:var(--card2);color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.ttl{font-size:14px;font-weight:600;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
.ttl b{color:#fff}
.pages{max-width:760px;margin:0 auto;padding:6px 16px 20px;display:grid;gap:12px}
.pages img{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
.foot{max-width:760px;margin:0 auto;padding:6px 16px 56px;text-align:center}
.foot a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:99px;background:var(--card2);color:#fff;text-decoration:none;font-size:14.5px;font-weight:600}
.foot p{font-size:13px;color:var(--sub);margin:12px 0 0}
</style>
</head>

<div class="bar"><div class="bar-in">

  <span class="ttl" id="ttl"><b id="cur">1</b> / 25</span>

<script>
(function(){
  var cur=document.getElementById('cur');
  if(!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)cur.textContent=e.target.getAttribute('data-n')})},{rootMargin:'-45% 0px -45% 0px'});
  document.querySelectorAll('.pages img').forEach(function(im){io.observe(im)});
})();
</script>
